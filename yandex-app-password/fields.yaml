title: создать пароль приложения Яндекса для доступа программы к Диску и записать его командой
fields:
  account:
    about: адрес аккаунта Яндекса, которому создаётся пароль приложения
    example: name@yandex.ru
  app_label:
    about: имя, которое вписывается в поле названия пароля и под которым его видно в списке
    example: disk-webdav
  save_command:
    about: команда, которая спрашивает пароль скрытым вводом и кладёт его в хранилище; значение в аргументах не передаётся
    example: ~/bin/save-app-password name@yandex.ru disk-webdav
  return_line:
    about: строка, которую человек пишет ИИ-агенту, когда пароль записан
    example: пароль приложения disk-webdav записан
