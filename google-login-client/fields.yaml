title: завести OAuth-клиент Google для входа на сайт и сохранить его ключи командой
fields:
  project_name:
    about: проект Google Cloud, общий для нескольких приложений (экран входа и тестовые пользователи — одни на проект)
    example: home-apps
  client_name:
    about: имя OAuth-клиента этого приложения внутри проекта
    example: example-app
  app_name:
    about: название приложения, которое Google показывает на экране входа
    example: Example
  redirect_uris:
    about: адреса возврата, по одному на строку, ровно как их шлёт сервер
    example: |
      http://localhost:8080/api/auth/google/callback
      https://app.example.org/api/auth/google/callback
  save_command:
    about: команда, которая принимает последним аргументом путь к JSON, скачанному со страницы клиента, сохраняет Client ID и секрет и удаляет файл
    example: ~/bin/save-oauth-client google
