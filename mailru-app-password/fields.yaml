title: создать пароль внешнего приложения Mail.ru для доступа программы к Облаку и записать его командой
fields:
  account:
    about: адрес аккаунта Mail.ru, которому создаётся пароль внешнего приложения
    example: name@mail.ru
  app_label:
    about: имя, которое вписывается в поле названия пароля и под которым его видно в списке
    example: cloud-reader
  save_command:
    about: команда, которая спрашивает пароль скрытым вводом и кладёт его в хранилище; значение в аргументах не передаётся
    example: ~/bin/save-app-password name@mail.ru cloud-reader
  return_line:
    about: строка, которую человек пишет ИИ-агенту, когда пароль записан
    example: пароль внешнего приложения cloud-reader записан
