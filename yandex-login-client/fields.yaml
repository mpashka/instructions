title: завести приложение Яндекс ID для входа на сайт и сохранить его ключи командой
fields:
  app_name:
    about: название приложения, которое Яндекс показывает на экране входа
    example: Example
  redirect_uris:
    about: адреса возврата, по одному на строку, ровно как их шлёт сервер
    example: |
      http://localhost:8080/api/auth/yandex/callback
      https://app.example.org/api/auth/yandex/callback
  save_command:
    about: команда, которая спрашивает ClientID и секрет и сохраняет их
    example: ~/bin/save-oauth-client yandex
