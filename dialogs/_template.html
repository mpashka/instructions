<!doctype html>
<!--
  Шаблон описания диалогов сайта. Копируется в dialogs/<сайт>.html.
  Надпись на языке интерфейса — <span lang="ru">…</span><span lang="en">…</span>;
  универсальное имя — data-field на поле или кнопке, оно же в инструкциях.
  Файл самодостаточный: без внешних скриптов, стилей и картинок, открывается двойным щелчком.
-->
<html lang="ru" data-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диалоги: example.com</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#d6d6d0;
          --accent:#2f6fd6; --tag:#fff3c4; --tag-ink:#6a5200; --opt:#e3efe3; --opt-ink:#2f5d2f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1a; --card:#262624; --ink:#ecece8; --muted:#a3a39c; --line:#44443f;
            --accent:#6fa0ff; --tag:#4a3f12; --tag-ink:#ffe7a0; --opt:#23402a; --opt-ink:#bfe3c3; }
  }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; }
  html[data-lang="ru"] [lang="en"], html[data-lang="en"] [lang="ru"] { display:none; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  .langs button { font:inherit; padding:4px 12px; border:1px solid var(--line); background:var(--card);
                  color:var(--ink); cursor:pointer; }
  .langs button:first-child { border-radius:6px 0 0 6px; }
  .langs button:last-child { border-radius:0 6px 6px 0; border-left:0; }
  html[data-lang="ru"] .langs [data-set="ru"], html[data-lang="en"] .langs [data-set="en"] {
    background:var(--accent); color:#fff; border-color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; }
  section.dialog { background:var(--card); border:1px solid var(--line); border-radius:10px;
                   padding:16px; margin:20px 0; }
  section.dialog > h2 { margin:0 0 4px; font-size:17px; }
  .url { font-family:ui-monospace, monospace; font-size:13px; color:var(--muted); margin-bottom:12px;
         overflow-wrap:anywhere; }
  .field, .button { position:relative; margin:18px 0 6px; }
  .field label { display:block; font-size:13px; color:var(--muted); margin-bottom:2px; }
  .field .input { border:1px solid var(--line); border-radius:6px; padding:8px 10px; min-height:20px;
                  color:var(--muted); }
  .button .btn { display:inline-block; padding:8px 16px; border-radius:6px; background:var(--accent);
                 color:#fff; }
  [data-field]::before { content:attr(data-field); position:absolute; top:-14px; right:0;
                         font:12px ui-monospace, monospace; background:var(--tag); color:var(--tag-ink);
                         padding:0 6px; border-radius:4px; }
  [data-optional]::after { content:"необязательно"; position:absolute; top:-14px; left:0;
                           font-size:12px; background:var(--opt); color:var(--opt-ink);
                           padding:0 6px; border-radius:4px; }
  html[data-lang="en"] [data-optional]::after { content:"optional"; }
  .note { font-size:13px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>example.com</h1>
    <div class="langs" role="group" aria-label="Язык интерфейса">
      <button type="button" data-set="ru">RU</button><button type="button" data-set="en">EN</button>
    </div>
  </header>
  <p class="meta">Проверено 2026-09-14. Язык сайта переключается: <span lang="ru">флаг справа вверху → «Русский»</span><span lang="en">flag top right → “English”</span>.</p>

  <section class="dialog" id="sign-in">
    <h2><span lang="ru">Вход</span><span lang="en">Sign in</span></h2>
    <div class="url">https://example.com/login</div>

    <div class="field" data-field="email">
      <label><span lang="ru">Электронная почта</span><span lang="en">Email</span></label>
      <div class="input">name@example.com</div>
    </div>
    <div class="field" data-field="middle-name" data-optional>
      <label><span lang="ru">Отчество</span><span lang="en">Middle name</span></label>
      <div class="input"></div>
    </div>
    <div class="button" data-field="submit">
      <span class="btn"><span lang="ru">Войти</span><span lang="en">Sign in</span></span>
    </div>

    <p class="note"><span lang="ru">После входа открывается личный кабинет.</span><span lang="en">After sign-in the dashboard opens.</span></p>
  </section>
</main>
<script>
  (() => {
    const root = document.documentElement;
    const apply = lang => { root.dataset.lang = lang; root.lang = lang; };
    try { const saved = localStorage.getItem("dialog-lang"); if (saved) apply(saved); } catch (e) {}
    document.querySelectorAll(".langs [data-set]").forEach(b => b.addEventListener("click", () => {
      apply(b.dataset.set);
      try { localStorage.setItem("dialog-lang", b.dataset.set); } catch (e) {}
    }));
  })();
</script>
</body>
</html>
